name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 빌드·테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: 테스트 (임베디드 PostgreSQL 16 포함)
        run: ./gradlew --no-daemon test
      - name: 실행 jar
        run: ./gradlew --no-daemon bootJar
      - name: 테스트 리포트 보관 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: backend/build/reports/tests/test

  frontend:
    name: 프론트엔드 빌드·테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: 타입 검사
        run: npx tsc -b
      - name: 린트
        run: npm run lint
      - name: 단위 테스트
        run: npm test
      - name: 빌드
        run: npm run build

  docker:
    name: Docker 이미지 빌드
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: 백엔드 이미지 (푸시는 배포 단계에서)
        run: docker build -f backend/Dockerfile -t mz-erp-backend:ci .
      - name: 웹 이미지
        run: docker build -f frontend/Dockerfile -t mz-erp-web:ci .

  scenario:
    name: 시나리오 정답 동기화 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 정답 재생성
        run: python -I tools/scenario/compute_answers.py
      - name: 커밋된 정답과 같은지 확인
        run: git diff --exit-code -- docs/scenario
