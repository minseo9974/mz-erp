# 로컬·운영 공통 구성: PostgreSQL 16 + 백엔드
#   cp .env.example .env   # 값 채우기
#   docker compose up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mzerp
      POSTGRES_USER: mzerp
      POSTGRES_PASSWORD: ${MZERP_DB_PASSWORD:?MZERP_DB_PASSWORD를 .env에 설정하세요}
    ports:
      - "127.0.0.1:5433:5432" # 로컬에 이미 PostgreSQL(5432)이 있을 수 있어 5433으로 노출
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mzerp -d mzerp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      MZERP_DB_URL: jdbc:postgresql://db:5432/mzerp
      MZERP_DB_USERNAME: mzerp
      MZERP_DB_PASSWORD: ${MZERP_DB_PASSWORD}
      MZERP_ADMIN_LOGIN_ID: ${MZERP_ADMIN_LOGIN_ID:-}
      MZERP_ADMIN_PASSWORD: ${MZERP_ADMIN_PASSWORD:-}
      MZERP_COOKIE_SECURE: ${MZERP_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
