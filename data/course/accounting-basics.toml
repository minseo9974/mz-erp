[[chapters.missions]]
key = "payable-payment"
scenario = 7
title = "외상매입금 지급"
explanation = '''
작년에 외상으로 사 온 원재료 대금을 오늘 갚은 거래예요.

- 원재료는 들어온 작년에 이미 기록됐고, 그때 '줄 돈'이 외상매입금(부채)으로 남았어요.
- 오늘은 빚을 갚았을 뿐이에요. → (차) 외상매입금 [대성소재] / (대) 보통예금

외상매입금과 미지급금의 차이: 둘 다 '줄 돈'이지만, 원재료·상품처럼 본업을 위해 사 온 것의 대금은 외상매입금, 그 밖의 것(임차료, 비품, 수수료 등)의 대금은 미지급금이에요. 재무상태표에서 본업의 빚이 얼마인지 따로 보려고 나눠요.

흔한 실수: 오늘 '원재료'를 또 잡는 것. 재고가 실제보다 많아지고, 대성소재에 줄 돈은 장부에 계속 남아요.

실무에서는: 거래처마다 결제 조건(예: 월말 마감 후 다음 달 말 지급)이 정해져 있어요. 지급 전에 거래처 원장의 잔액과 거래처가 보낸 청구 내역이 맞는지 확인해요.
'''
brief = "(주)대성소재에 작년 원재료 외상 대금 7,000,000원을 보통예금에서 이체했어요."
hints = [
  "원재료는 작년에 이미 들어왔고 그때 장부에 기록됐어요. 오늘은 갚을 돈을 갚은 것뿐이에요.",
  "갚을 돈(부채)이 줄면 차변이에요. 미지급금과 외상매입금을 구분하세요: 원재료·상품처럼 본업의 매입 대금은 외상매입금이에요.",
]

