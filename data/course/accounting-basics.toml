[[chapters.missions]]
key = "receivable-collection"
scenario = 5
title = "외상매출금 회수"
explanation = '''
작년에 외상으로 판 대금이 오늘 통장에 들어온 거래예요.

- 매출은 물건을 넘긴 작년에 이미 기록됐어요. 그때 '받을 돈'이 외상매출금(자산)으로 남았어요.
- 오늘은 받을 돈이 진짜 돈으로 바뀐 것뿐이에요. 자산(외상매출금)이 줄고 자산(보통예금)이 늘어요.
- 자산이 늘면 차변, 줄면 대변. → (차) 보통예금 / (대) 외상매출금 [한빛전자]

흔한 실수: 돈이 들어왔다고 '제품매출'로 잡는 것. 그러면 같은 매출이 두 번 기록되고, 한빛전자에게 받을 돈 12,000,000원은 계속 장부에 남아 있게 돼요. 수익은 돈을 받은 날이 아니라 물건을 넘긴 날에 기록한다는 것(발생주의)이 이 미션의 핵심이에요.

실무에서는: 입금자 이름만 보고 어느 거래처의 어느 청구 건인지 찾아 지우는 일을 '채권 반제'라고 해요. 금액이 청구액과 다르면(일부 입금, 수수료 차감) 차액을 따로 처리해야 해요.
'''
brief = "(주)한빛전자가 작년 외상 대금 12,000,000원을 보통예금으로 보내왔어요."
hints = [
  "매출은 물건을 판 작년에 이미 기록됐어요. 오늘은 받을 돈이 예금으로 바뀐 것뿐이에요.",
  "받을 돈(자산)이 줄고 예금(자산)이 늘어요. 어느 거래처의 외상매출금이 줄었는지 넣어야 거래처별 잔액이 맞아요.",
]

