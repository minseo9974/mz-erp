[[chapters.missions]]
key = "note-payable-settlement"
scenario = 8
title = "지급어음 결제"
explanation = '''
우리가 대금 대신 끊어 준 약속어음이 만기가 되어 통장에서 돈이 빠져나간 거래예요.

- 어음을 끊어 줄 때 '지급어음'(부채)으로 장부에 올려 두었어요. '이 날짜에 이 금액을 주겠다'는 약속이에요.
- 만기에 은행이 통장에서 돈을 내주면 약속을 지킨 것이니 부채가 없어져요.
- → (차) 지급어음 [대성소재] / (대) 보통예금

흔한 실수: 외상매입금을 줄이는 것. 어음을 끊어 준 날에 이미 외상매입금이 지급어음으로 바뀌어 있어요. 여기서 외상매입금을 또 줄이면 지급어음은 그대로 남고 외상매입금은 실제보다 적어져요.

실무에서는: 지급어음 만기일에 통장 잔액이 모자라면 부도가 나요. 그래서 자금 담당자는 만기일별 지급어음 금액을 미리 모아 보고 예금을 준비해 둡니다.
'''
brief = "(주)대성소재에 끊어 준 약속어음 3,000,000원이 오늘 만기가 되어 보통예금에서 빠져나갔어요."
