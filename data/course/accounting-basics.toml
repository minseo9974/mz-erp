[[chapters.missions]]
key = "accounts-payable-other-payment"
scenario = 2
title = "미지급금 지급"
explanation = '''
작년에 서비스를 받고 아직 주지 못한 대금을 오늘 준 거래예요.

- 비용은 서비스를 받은 작년에 이미 기록됐고, 그때 '줄 돈'이 미지급금(부채)으로 남았어요.
- 오늘은 그 빚을 갚았을 뿐이에요. 부채가 줄면 차변. → (차) 미지급금 [케이렌탈]
- 보통예금이 줄었으니 대변. → (대) 보통예금

흔한 실수 두 가지:
1. 오늘 비용(임차료 등)으로 또 잡는 것. 같은 비용이 작년과 올해에 두 번 기록돼요.
2. 거래처를 빼먹는 것. 미지급금은 '누구에게 얼마'를 따로 관리하는 계정이라, 거래처가 없으면 케이렌탈의 잔액이 줄지 않고 그대로 남아요.

실무에서는: 돈을 보내기 전에 거래처별 미지급금 잔액을 먼저 확인해요. 이체한 금액과 잔액이 맞지 않으면 그 차이가 무엇인지 설명할 수 있어야 해요.
'''
brief = "(주)케이렌탈에 작년에 못 준 대금 1,500,000원을 보통예금에서 이체했어요."
hints = [
  "이 돈은 작년에 이미 비용으로 잡혀 있어요. 오늘 새로 생긴 비용이 아니에요.",
  "갚을 돈(부채)이 줄었어요. 미지급금은 거래처별로 관리하니 누구에게 준 것인지도 넣어야 해요.",
]

