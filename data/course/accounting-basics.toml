# 과정: 회계팀 첫 1년 — (주)엠제트전자 제6기(2026)
#
# 미션의 정답 분개는 여기에 적지 않는다. scenario = N 으로 시나리오 거래를 가리키고,
# 날짜·정답 라인은 data/scenario/<scenario>.toml 의 그 거래에서 가져온다 (ADR-0015).
# evidence 는 실습자가 전표를 쓰기 전에 보는 증빙이다 (종류: bank 통장 거래내역, slip 영수증·확인증, note 약속어음).
#   통장 거래내역의 줄은 [일자, 적요, 출금, 입금, 잔액]. 잔액은 과정의 미션을 순서대로 처리했을 때의
#   보통예금(103) 장부 잔액과 같아야 한다 — CourseContentTest 가 확인한다.
#   은행·계좌번호·어음번호는 모두 꾸며 낸 것이다. 화면은 모든 증빙에 '실습용' 표시를 넣는다.
# explanation 은 미션을 끝낸 뒤에만 보여 주는 해설이다: 왜 이 분개인가, 흔한 실수, 실무에서는.
# 정답으로 인정할 다른 분개가 있으면 accept = [ [["D","계정",금액,"거래처"], ...], ... ] 로 적는다.
#
# 기준 연도: 2026. 장을 추가할 때마다 version 을 올린다.

key = "accounting-basics"
version = 1
title = "회계팀 첫 1년"
scenario = "mz-electronics-2026"

# ---------------------------------------------------------------------------
# 1장. 전표의 기본 — 통장으로 오간 돈을 일반전표로 옮긴다
#   여기 나오는 거래는 모두 "이미 장부에 있던 채권·채무가 예금으로 정리되는" 거래다.
#   새 수익·비용이 생기지 않는다는 점이 핵심이다 (회계 노트 01, 02).
# ---------------------------------------------------------------------------
[[chapters]]
key = "ch1"
title = "전표의 기본"

[[chapters.missions]]
key = "withholding-tax-payment"
scenario = 1
title = "원천세 납부"
explanation = '''
회사는 급여를 줄 때 직원이 낼 소득세·지방소득세를 미리 떼어 두었다가, 다음 달 10일까지 세무서에 대신 냅니다.

- 떼어 둔 돈은 회사 돈이 아니라 잠시 맡은 돈이라서, 작년 12월에 '예수금'이라는 부채로 장부에 올라가 있었어요.
- 오늘 그 돈을 냈으니 부채가 없어집니다. 부채가 줄면 차변이에요. → (차) 예수금
- 돈은 보통예금에서 나갔어요. 자산이 줄면 대변이에요. → (대) 보통예금

흔한 실수: '세금과공과' 같은 비용으로 처리하는 것. 이 세금은 회사가 부담한 것이 아니라 직원의 세금을 전달한 것이라 비용이 아니에요. 비용으로 잡으면 이익이 250,000원 줄고, 예수금은 영원히 장부에 남습니다.

실무에서는: 매달 10일이 원천세 신고·납부일이에요. 납부서 금액과 예수금 잔액이 같은지 맞춰 보는 것이 신입이 가장 먼저 맡는 일 가운데 하나예요.
'''
brief = "작년 12월 급여에서 떼어 둔 세금 250,000원을 오늘 보통예금에서 납부했어요. 통장 내역을 보고 전표를 올려 주세요."
hints = [
  "급여에서 떼어 둔 세금은 회사 돈이 아니라 직원 대신 잠시 맡아 둔 돈이에요. 맡아 둔 돈은 부채예요.",
  "맡아 둔 돈을 세무서에 내면 부채가 줄어요. 부채가 줄면 차변, 예금이 줄면 대변이에요.",
]

