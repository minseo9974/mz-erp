# 과정: 회계팀 첫 1년 — (주)엠제트전자 제6기(2026)
#
# 미션의 정답 분개는 여기에 적지 않는다. scenario = N 으로 시나리오 거래를 가리키고,
# 날짜·정답 라인은 data/scenario/<scenario>.toml 의 그 거래에서 가져온다 (ADR-0015).
# 정답으로 인정할 다른 분개가 있으면 accept = [ [["D","계정",금액,"거래처"], ...], ... ] 로 적는다.
#
# 기준 연도: 2026. 장을 추가할 때마다 version 을 올린다.

key = "accounting-basics"
version = 1
title = "회계팀 첫 1년"
scenario = "mz-electronics-2026"

# ---------------------------------------------------------------------------
# 1장. 전표의 기본 — 통장으로 오간 돈을 일반전표로 옮긴다
#   여기 나오는 거래는 모두 "이미 장부에 있던 채권·채무가 예금으로 정리되는" 거래다.
#   새 수익·비용이 생기지 않는다는 점이 핵심이다 (회계 노트 01, 02).
# ---------------------------------------------------------------------------
[[chapters]]
key = "ch1"
title = "전표의 기본"

[[chapters.missions]]
key = "withholding-tax-payment"
scenario = 1
title = "원천세 납부"
brief = "작년 12월 급여에서 떼어 둔 세금 250,000원을 오늘 보통예금에서 납부했어요. 통장 내역을 보고 전표를 올려 주세요."
hints = [
  "급여에서 떼어 둔 세금은 회사 돈이 아니라 직원 대신 잠시 맡아 둔 돈이에요. 맡아 둔 돈은 부채예요.",
  "맡아 둔 돈을 세무서에 내면 부채가 줄어요. 부채가 줄면 차변, 예금이 줄면 대변이에요.",
]

[[chapters.missions]]
key = "accounts-payable-other-payment"
scenario = 2
title = "미지급금 지급"
brief = "(주)케이렌탈에 작년에 못 준 대금 1,500,000원을 보통예금에서 이체했어요."
hints = [
  "이 돈은 작년에 이미 비용으로 잡혀 있어요. 오늘 새로 생긴 비용이 아니에요.",
  "갚을 돈(부채)이 줄었어요. 미지급금은 거래처별로 관리하니 누구에게 준 것인지도 넣어야 해요.",
]

[[chapters.missions]]
key = "receivable-collection"
scenario = 5
title = "외상매출금 회수"
brief = "(주)한빛전자가 작년 외상 대금 12,000,000원을 보통예금으로 보내왔어요."
hints = [
  "매출은 물건을 판 작년에 이미 기록됐어요. 오늘은 받을 돈이 예금으로 바뀐 것뿐이에요.",
  "받을 돈(자산)이 줄고 예금(자산)이 늘어요. 어느 거래처의 외상매출금이 줄었는지 넣어야 거래처별 잔액이 맞아요.",
]

[[chapters.missions]]
key = "note-receivable-maturity"
scenario = 6
title = "받을어음 만기"
brief = "(주)한빛전자에서 받아 둔 약속어음 5,000,000원이 오늘 만기가 되어 보통예금에 들어왔어요."
hints = [
  "어음은 '나중에 이 돈을 주겠다'는 증서예요. 받아 둔 어음은 자산(받을어음)으로 장부에 있어요.",
  "만기에 돈이 들어오면 받을어음이 없어지고 예금이 늘어요. 받을어음도 거래처별로 관리해요.",
]

[[chapters.missions]]
key = "payable-payment"
scenario = 7
title = "외상매입금 지급"
brief = "(주)대성소재에 작년 원재료 외상 대금 7,000,000원을 보통예금에서 이체했어요."
hints = [
  "원재료는 작년에 이미 들어왔고 그때 장부에 기록됐어요. 오늘은 갚을 돈을 갚은 것뿐이에요.",
  "갚을 돈(부채)이 줄면 차변이에요. 미지급금과 외상매입금을 구분하세요: 원재료·상품처럼 본업의 매입 대금은 외상매입금이에요.",
]

[[chapters.missions]]
key = "note-payable-settlement"
scenario = 8
title = "지급어음 결제"
brief = "(주)대성소재에 끊어 준 약속어음 3,000,000원이 오늘 만기가 되어 보통예금에서 빠져나갔어요."
hints = [
  "우리가 끊어 준 어음은 '나중에 주겠다'는 약속이라 부채(지급어음)로 장부에 있어요.",
  "만기에 돈이 나가면 지급어음이 없어지고 예금이 줄어요.",
]
