[[chapters.missions]]
key = "note-receivable-maturity"
scenario = 6
title = "받을어음 만기"
explanation = '''
거래처에서 대금 대신 받아 둔 약속어음이 만기가 되어 돈으로 들어온 거래예요.

- 어음을 받았을 때 '받을어음'(자산)으로 장부에 올려 두었어요. 외상매출금과 비슷하지만, 날짜와 금액이 적힌 증서가 있다는 점이 달라요.
- 만기에 은행이 돈을 받아 통장에 넣어 주면, 어음은 역할을 다해 없어지고 예금이 늘어요.
- → (차) 보통예금 / (대) 받을어음 [한빛전자]

흔한 실수: 외상매출금을 줄이는 것. 한빛전자에게 받을 돈이라는 점은 같지만, 장부에는 외상매출금과 받을어음이 따로 있어요. 외상매출금을 줄이면 받을어음은 그대로 남고 외상매출금은 실제보다 적어져요.

실무에서는: 어음은 만기일을 놓치지 않게 따로 관리해요(받을어음 명세서). 만기 전에 은행에 넘겨 돈을 먼저 받는 '할인'은 이자 성격의 비용이 생기는 다른 거래예요.
'''
brief = "(주)한빛전자에서 받아 둔 약속어음 5,000,000원이 오늘 만기가 되어 보통예금에 들어왔어요."
hints = [
  "어음은 '나중에 이 돈을 주겠다'는 증서예요. 받아 둔 어음은 자산(받을어음)으로 장부에 있어요.",
  "만기에 돈이 들어오면 받을어음이 없어지고 예금이 늘어요. 받을어음도 거래처별로 관리해요.",
]

